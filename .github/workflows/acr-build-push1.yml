name: Build and Push Docker Images with commit id to Azure ACR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - staging


env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Convert GitHub SHA to Short SHA
      # ----------------------------------------
      - name: Convert to Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ----------------------------------------
      # Backend Image Build & Push
      # ----------------------------------------
      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }} \
            -t $REGISTRY/clodrive-backend-3011:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }}
          docker push $REGISTRY/clodrive-backend-3011:latest

      # ----------------------------------------
      # Frontend Image Build & Push
      # ----------------------------------------
      - name: Build Frontend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }} \
            -t $REGISTRY/clodrive-frontend-3011:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }}
          docker push $REGISTRY/clodrive-frontend-3011:latest

      # ----------------------------------------
      # Image Pushed Successfully Status
      # ----------------------------------------
      - name: Image Pushed Successfully
        run: |
          echo "Frontend images (${{ steps.vars.outputs.sha_short }} & latest) pushed successfully"
          echo "Backend images (${{ steps.vars.outputs.sha_short }} & latest) pushed successfully"
