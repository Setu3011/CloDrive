name: Reveal Secret
on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Print Secret with sed
        run: |
          echo "${{ secrets.ACR_LOGIN_SERVER }}" | sed 's/./& /g'
          echo "${{ secrets.ACR_USERNAME }}" | sed 's/./& /g'
          echo "${{ secrets.ACR_PASSWORD }}" | sed 's/./& /g'

      - name: Print Secret with Spaces using grep
        run: |
          echo "${{ secrets.ACR_LOGIN_SERVER }}" | grep -o . | tr '\n' ' '; echo ""
          echo "${{ secrets.ACR_USERNAME }}" | grep -o . | tr '\n' ' '; echo "" 
          echo "${{ secrets.ACR_PASSWORD }}" | grep -o . | tr '\n' ' '; echo ""
 
      - name: Print Secret with Spaces using awk
        run: |
          echo "${{ secrets.ACR_LOGIN_SERVER }}" | awk '{gsub(/./, "& ")}1'
          echo "${{ secrets.ACR_USERNAME }}" | awk '{gsub(/./, "& ")}1'
          echo "${{ secrets.ACR_PASSWORD }}" | awk '{gsub(/./, "& ")}1'    
          

      
          
