name: Build, Push and Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - staging

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

  RESOURCE_GROUP: azure-resource-group

  CONTAINER_APP_ENV: clodrive-env

  BACKEND_APP: clodrive-backend
  FRONTEND_APP: clodrive-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:

      # ====================================================
      # CHECKOUT SOURCE
      # ====================================================

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ====================================================
      # SHORT COMMIT ID
      # ====================================================

      - name: Convert SHA to Short SHA
        id: vars
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ====================================================
      # LOGIN TO ACR
      # ====================================================

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ====================================================
      # BUILD BACKEND IMAGE
      # ====================================================

      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }} \
            -t $REGISTRY/clodrive-backend-3011:latest \
            ./backend

      # ====================================================
      # PUSH BACKEND IMAGE
      # ====================================================

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }}
          docker push $REGISTRY/clodrive-backend-3011:latest

      # ====================================================
      # BUILD FRONTEND IMAGE
      # ====================================================

      - name: Build Frontend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }} \
            -t $REGISTRY/clodrive-frontend-3011:latest \
            ./frontend

      # ====================================================
      # PUSH FRONTEND IMAGE
      # ====================================================

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }}
          docker push $REGISTRY/clodrive-frontend-3011:latest

      # ====================================================
      # AZURE LOGIN
      # ====================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ====================================================
      # DEPLOY BACKEND CONTAINER APP
      # ====================================================

      - name: Deploy Backend Container App
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }}

      # ====================================================
      # DEPLOY FRONTEND CONTAINER APP
      # ====================================================

      - name: Deploy Frontend Container App
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }}

      # ====================================================
      # SHOW DEPLOYMENT DETAILS
      # ====================================================

      - name: Display Deployment Information
        run: |
          echo "=================================="
          echo "Deployment Successful"
          echo "=================================="
          echo "Backend App  : $BACKEND_APP"
          echo "Frontend App : $FRONTEND_APP"
          echo "Resource Group : $RESOURCE_GROUP"
          echo "Container App Env : $CONTAINER_APP_ENV"
          echo "Image Tag : ${{ steps.vars.outputs.sha_short }}"
          echo "=================================="

      # ====================================================
      # GET FRONTEND URL
      # ====================================================

      - name: Get Frontend URL
        run: |
          az containerapp show \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            -o tsv

      # ====================================================
      # GET BACKEND URL
      # ====================================================

      - name: Get Backend URL
        run: |
          az containerapp show \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            -o tsv