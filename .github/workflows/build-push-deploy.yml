name: Build, Push and Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - staging

env:
REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

RESOURCE_GROUP: azure-resource-group

BACKEND_APP: clodrive-backend
FRONTEND_APP: clodrive-frontend

# JOB 1 : BUILD & PUSH

jobs:
build-and-push:
runs-on: ubuntu-latest
environment: dev

outputs:
  sha_short: ${{ steps.vars.outputs.sha_short }}

steps:

  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Convert SHA to Short SHA
    id: vars
    run: |
      echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  - name: Login to Azure Container Registry
    uses: docker/login-action@v3
    with:
      registry: ${{ secrets.ACR_LOGIN_SERVER }}
      username: ${{ secrets.ACR_USERNAME }}
      password: ${{ secrets.ACR_PASSWORD }}

  # ==========================================
  # Backend Build & Push
  # ==========================================

  - name: Build Backend Image
    id: backend_build
    run: |
      docker build \
        -t $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }} \
        -t $REGISTRY/clodrive-backend-3011:latest \
        ./backend

  - name: Push Backend Image
    id: backend_push
    run: |
      docker push $REGISTRY/clodrive-backend-3011:${{ steps.vars.outputs.sha_short }}
      docker push $REGISTRY/clodrive-backend-3011:latest

  # ==========================================
  # Frontend Build & Push
  # ==========================================

  - name: Build Frontend Image
    id: frontend_build
    run: |
      docker build \
        -t $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }} \
        -t $REGISTRY/clodrive-frontend-3011:latest \
        ./frontend

  - name: Push Frontend Image
    id: frontend_push
    run: |
      docker push $REGISTRY/clodrive-frontend-3011:${{ steps.vars.outputs.sha_short }}
      docker push $REGISTRY/clodrive-frontend-3011:latest

  - name: Build and Push Completed
    run: |
      echo "Images pushed successfully"

  # ==========================================
  # SUCCESS EMAIL
  # ==========================================

  - name: Send Success Email
    if: success()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true

      username: ${{ vars.MAIL_USERNAME }}
      password: ${{ secrets.MAIL_PASSWORD }}

      subject: "✅ Build & Push Successful"

      to: ${{ vars.MAIL_TO }}
      from: GitHub Actions

      body: |
        Build and Push completed successfully.

        Repository:
        ${{ github.repository }}

        Image Tag:
        ${{ steps.vars.outputs.sha_short }}

        Workflow URL:
        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ==========================================
  # FAILURE EMAIL
  # ==========================================

  - name: Send Failure Email
    if: failure()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true

      username: ${{ vars.MAIL_USERNAME }}
      password: ${{ secrets.MAIL_PASSWORD }}

      subject: "❌ Build & Push Failed"

      to: ${{ vars.MAIL_TO }}
      from: GitHub Actions

      body: |
        Build or Push failed.

        Repository:
        ${{ github.repository }}

        Workflow URL:
        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

# JOB 2 : DEPLOY TO CONTAINER APPS

deploy:
needs: build-and-push


runs-on: ubuntu-latest

environment: dev

steps:

  - name: Azure Login
    uses: azure/login@v2
    with:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  # ==========================================
  # Deploy Backend
  # ==========================================

  - name: Deploy Backend Container App
    run: |
      az containerapp update \
        --name $BACKEND_APP \
        --resource-group $RESOURCE_GROUP \
        --image $REGISTRY/clodrive-backend-3011:${{ needs.build-and-push.outputs.sha_short }}

  # ==========================================
  # Deploy Frontend
  # ==========================================

  - name: Deploy Frontend Container App
    run: |
      az containerapp update \
        --name $FRONTEND_APP \
        --resource-group $RESOURCE_GROUP \
        --image $REGISTRY/clodrive-frontend-3011:${{ needs.build-and-push.outputs.sha_short }}

  - name: Deployment Completed
    run: |
      echo "Backend deployed successfully"
      echo "Frontend deployed successfully"

  # ==========================================
  # DEPLOYMENT SUCCESS EMAIL
  # ==========================================

  - name: Deployment Success Email
    if: success()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true

      username: ${{ vars.MAIL_USERNAME }}
      password: ${{ secrets.MAIL_PASSWORD }}

      subject: "🚀 Azure Container Apps Deployment Successful"

      to: ${{ vars.MAIL_TO }}
      from: GitHub Actions

      body: |
        Deployment completed successfully.

        Resource Group:
        azure-resource-group

        Backend App:
        clodrive-backend

        Frontend App:
        clodrive-frontend

        Image Tag:
        ${{ needs.build-and-push.outputs.sha_short }}

        Workflow URL:
        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ==========================================
  # DEPLOYMENT FAILURE EMAIL
  # ==========================================

  - name: Deployment Failure Email
    if: failure()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true

      username: ${{ vars.MAIL_USERNAME }}
      password: ${{ secrets.MAIL_PASSWORD }}

      subject: "❌ Azure Container Apps Deployment Failed"

      to: ${{ vars.MAIL_TO }}
      from: GitHub Actions

      body: |
        Deployment failed.

        Workflow URL:
        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
