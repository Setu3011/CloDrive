name: Build and Push Docker Images to Azure ACR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ----------------------------------------
      # Backend Image Build & Push
      # ----------------------------------------
      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-backend-3011:${{ github.sha }} \
            -t $REGISTRY/clodrive-backend-3011:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/clodrive-backend-3011:${{ github.sha }}
          docker push $REGISTRY/clodrive-backend-3011:latest

      # ----------------------------------------
      # Frontend Image Build & Push
      # ----------------------------------------
      - name: Build Frontend Image
        run: |
          docker build \
            -t $REGISTRY/clodrive-frontend-3011:${{ github.sha }} \
            -t $REGISTRY/clodrive-frontend-3011:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/clodrive-frontend-3011:${{ github.sha }}
          docker push $REGISTRY/clodrive-frontend-3011:latest

      # ----------------------------------------
      # image pushed successfully
      # ----------------------------------------
      - name: Image Pushed Successfully
        run: |
          echo "Frontend images (${{ github.sha }} & latest) pushed successfully"
          echo "Backend images (${{ github.sha }} & latest) pushed successfully"
