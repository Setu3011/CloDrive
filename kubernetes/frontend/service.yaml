apiVersion: v1
kind: Service
metadata:
  name: clodrive-frontend-service
  namespace: clodrive

spec:
  type: NodePort

  selector:
    app: clodrive-frontend

  ports:
    - name: http
      protocol: TCP
      port: 80                               # The service will listen on port 80 for incoming HTTP traffic.
      targetPort: 80                        
                                             # The service will forward the traffic to port 80 of the frontend pods, which is where the frontend application is running.
      nodePort: 30080
                                             # The service will expose the frontend application on port 30080 of each node in the Kubernetes cluster. This allows external clients to access the frontend application by sending requests to any node's IP address on port 30080.
    